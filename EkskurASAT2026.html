<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan Soal Ekskur Fisika</title>
<style>
:root{--bg1:#0b1033;--bg2:#2a1b5e;--bg3:#0e5a7a;--card:rgba(255,255,255,.09);--line:rgba(255,255,255,.2);--tx:#f2f5ff;--mute:#b9c3ee;--acc:#ffd166;--ok:#3ddc97;--bad:#ff6b8b;--cy:#5ee1ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b1033}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff,transparent),radial-gradient(2px 2px at 55% 35%,#cdeaff,transparent),radial-gradient(1.5px 1.5px at 75% 80%,#fff,transparent),radial-gradient(2px 2px at 90% 15%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 20% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 65% 10%,#fff,transparent),radial-gradient(2px 2px at 45% 55%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.4}to{opacity:1}}
.fl{position:fixed;font-weight:700;color:rgba(255,255,255,.13);pointer-events:none;animation:fy 14s ease-in-out infinite alternate;font-size:2rem}
@keyframes fy{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-40px) rotate(6deg)}}
.orb{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;opacity:.35}
main{position:relative;max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;margin-bottom:14px}
h1{margin:0;font-size:clamp(1.5rem,5vw,2.2rem);letter-spacing:.5px}
h1 span{color:var(--acc)}
.sub{color:var(--mute);font-size:.95rem;margin-top:4px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:.8rem;cursor:pointer}
.dot.cur{outline:2px solid var(--acc);color:#fff}
.dot.ok{background:var(--ok);color:#06281a;border-color:transparent}
.dot.bad{background:var(--bad);color:#3a0614;border-color:transparent}
.bar{height:6px;border-radius:9px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--acc));transition:width .4s}
.card{margin-top:14px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.tag{display:inline-block;padding:3px 11px;border-radius:99px;background:rgba(255,209,102,.18);color:var(--acc);font-size:.78rem;font-weight:600;margin-bottom:8px}
.q{font-size:1.06rem;line-height:1.6;margin:0 0 12px}
.fig{background:rgba(5,10,40,.55);border:1px solid var(--line);border-radius:14px;padding:8px;margin:6px 0 14px;text-align:center}
.fig svg{width:100%;max-width:420px;height:auto}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font:inherit;cursor:pointer;transition:transform .15s,background .15s}
.opt:hover:not(:disabled){transform:translateX(4px);background:rgba(255,255,255,.14)}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.opt.ok{background:rgba(61,220,151,.22);border-color:var(--ok)}
.opt.bad{background:rgba(255,107,139,.22);border-color:var(--bad)}
.opt.sel{background:rgba(94,225,255,.22);border-color:var(--cy)}
.rvs{display:grid;gap:14px;margin:14px 0;text-align:left}
.rv{padding:14px;border-radius:14px;background:rgba(255,255,255,.07)}
.rv .rq{margin:8px 0;line-height:1.55}
.rv .exp{margin-top:10px}
.exp{display:none;margin-top:14px;padding:14px;border-radius:13px;background:rgba(94,225,255,.1);border:1px solid rgba(94,225,255,.35);line-height:1.6;font-size:.96rem}
.exp.show{display:block;animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.exp h4{margin:0 0 6px;color:var(--cy)}
.warn{margin-top:8px;color:var(--acc);font-size:.9rem}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.btn{padding:11px 20px;border-radius:12px;border:0;font:inherit;font-weight:600;cursor:pointer;color:#14143a;background:linear-gradient(90deg,var(--cy),var(--acc))}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
.score{text-align:center}
.big{font-size:3.4rem;font-weight:800;color:var(--acc)}
.rev{display:grid;gap:6px;margin:14px 0;text-align:left}
.rev div{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.07);font-size:.92rem}
svg text{fill:#e8edff;font-family:inherit}
</style>
</head>
<body>
<div class="stars"></div>
<div class="orb" style="width:340px;height:340px;background:#7b5cff;top:-80px;left:-80px"></div>
<div class="orb" style="width:300px;height:300px;background:#00c2ff;bottom:-60px;right:-60px"></div>
<span class="fl" style="top:12%;left:6%">F = m·a</span>
<span class="fl" style="top:40%;right:5%;animation-delay:-4s">∑τ = 0</span>
<span class="fl" style="bottom:12%;left:10%;animation-delay:-8s">E = ½mv²</span>
<span class="fl" style="top:70%;right:22%;animation-delay:-2s">φ</span>
<main>
<header>
<h1>⚛️ Latihan Soal <span>Ekskur Fisika</span></h1>
<div class="sub">10 soal persiapan ujian · pilih jawabanmu, kunci dan pembahasan muncul di akhir</div>
</header>
<div class="bar"><i id="pb"></i></div>
<div class="dots" id="dots"></div>
<div id="view"></div>
</main>
<script>
const W=(c,s)=>`<svg viewBox="0 0 320 200" role="img">${s}</svg>`;
const arrow=(x1,y1,x2,y2,c,l,lx,ly)=>`<defs><marker id="m${c.slice(1)}" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="${c}"/></marker></defs><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="3" marker-end="url(#m${c.slice(1)})"/><text x="${lx}" y="${ly}" font-size="13" style="fill:${c}">${l}</text>`;
const F={
1:()=>W(0,`<g stroke="#8fa0e0" stroke-width="1.5"><line x1="30" y1="20" x2="30" y2="185"/><line x1="30" y1="80" x2="305" y2="80"/></g><g stroke="#7a88c8" stroke-dasharray="4" fill="none"><path d="M110 20V80M190 20V80M230 80V140M270 140V80M30 20H110M30 140H270"/></g><polyline points="30,80 110,20 190,20 230,80 270,140" fill="none" stroke="#5ee1ff" stroke-width="3"/><g font-size="12"><text x="2" y="24">12</text><text x="6" y="84">0</text><text x="0" y="144">−12</text><text x="106" y="96">4</text><text x="186" y="96">8</text><text x="224" y="96">10</text><text x="264" y="96">12</text><text x="38" y="14">v (m/s)</text><text x="280" y="74">t (s)</text></g>`),
2:()=>W(0,`<rect x="125" y="20" width="50" height="165" rx="3" fill="#3b4a8f" stroke="#8fa0e0"/><line x1="40" y1="185" x2="280" y2="185" stroke="#7bd88f" stroke-width="3"/><circle cx="108" cy="24" r="9" fill="#ffd166"/>${arrow(108,40,108,100,"#ffd166","A",90,70)}<circle cx="192" cy="178" r="9" fill="#ff6b8b"/>${arrow(192,160,192,100,"#ff6b8b","B",202,130)}<text x="205" y="30" font-size="12">80 m</text><text x="205" y="170" font-size="11" style="fill:#ff6b8b">v₀ = 40 m/s</text><text x="30" y="16" font-size="12">A jatuh bebas ↓</text>`),
3:()=>W(0,`<polygon points="20,175 290,175 290,22" fill="#3b4a8f" stroke="#8fa0e0"/><g transform="translate(150,114) rotate(-30)"><rect x="-22" y="-26" width="44" height="26" rx="3" fill="#ffd166"/><text x="-14" y="-9" font-size="11" style="fill:#222">5 kg</text>${arrow(26,-13,84,-13,"#5ee1ff","F = 60 N",30,-20)}${arrow(-26,-4,-62,-4,"#ff6b8b","f = 10 N",-82,12)}</g><path d="M62 175A32 32 0 0 0 52 160" stroke="#fff" fill="none"/><text x="66" y="168" font-size="11">30°</text><text x="170" y="170" font-size="11">s = 4 m</text>`),
4:()=>W(0,`<path d="M20 40C80 40 90 170 150 170S215 78 290 78" fill="none" stroke="#5ee1ff" stroke-width="4"/><g stroke="#7a88c8" stroke-dasharray="4"><line x1="20" y1="40" x2="20" y2="180"/><line x1="270" y1="78" x2="270" y2="180"/><line x1="20" y1="180" x2="300" y2="180"/></g><circle cx="26" cy="38" r="8" fill="#ffd166"/><text x="34" y="30" font-size="12">v₀ = 2 m/s</text><text x="26" y="112" font-size="12">h = 5 m</text><text x="215" y="130" font-size="12">h₂ = 3,4 m</text><text x="150" y="194" font-size="12">h = 0</text><circle cx="262" cy="78" r="8" fill="#ff6b8b"/><text x="236" y="66" font-size="12">v = ?</text>`),
5:()=>W(0,`<polygon points="40,98 28,125 52,125" fill="#8fa0e0"/><rect x="40" y="88" width="220" height="10" rx="3" fill="#ffd166"/><text x="30" y="82" font-size="13">A</text><text x="262" y="82" font-size="13">B</text>${arrow(205,88,205,28,"#5ee1ff","T",212,40)}${arrow(150,98,150,140,"#ff6b8b","6 kg",158,140)}<line x1="260" y1="98" x2="260" y2="122" stroke="#fff"/><rect x="244" y="122" width="32" height="26" rx="3" fill="#ff6b8b"/><text x="248" y="139" font-size="11" style="fill:#222">3 kg</text><g font-size="11"><text x="85" y="170">3 m dari A (tali)</text><text x="85" y="186">panjang batang 4 m</text></g>`),
6:()=>W(0,`<g stroke="#7a88c8" stroke-dasharray="4"><line x1="40" y1="100" x2="130" y2="100"/><line x1="85" y1="10" x2="85" y2="190"/></g><polygon points="40,190 130,190 130,100 85,10 40,100" fill="rgba(94,225,255,.25)" stroke="#5ee1ff" stroke-width="2.5"/><line x1="40" y1="100" x2="130" y2="100" stroke="#5ee1ff" stroke-dasharray="5"/><g font-size="12"><text x="92" y="14">(3, 12)</text><text x="136" y="104">(6, 6)</text><text x="136" y="194">(6, 0)</text><text x="4" y="104">(0, 6)</text><text x="22" y="194">0</text></g><g font-size="11"><text x="190" y="70">Persegi: 6 × 6, A = 36</text><text x="190" y="90">Segitiga: alas 6, t = 6, A = 18</text></g>`),
7:()=>W(0,`<line x1="40" y1="100" x2="300" y2="100" stroke="#445" stroke-dasharray="3"/>${arrow(60,100,60,76,"#ffd166","V_L = 2 V",70,70)}${arrow(60,100,60,148,"#ff6b8b","V_C = 6 V",70,160)}${arrow(60,100,140,100,"#5ee1ff","V_R = 4 V",150,95)}`),
8:()=>W(0,`${arrow(160,100,96,100,"#5ee1ff","16 V",90,92)}${arrow(160,100,160,68,"#ffd166","8 V",168,78)}${arrow(160,100,160,180,"#ff6b8b","20 V",168,160)}`),
9:()=>W(0,`<polygon points="40,150 190,150 190,50" fill="rgba(94,225,255,.15)" stroke="#5ee1ff" stroke-width="2.5"/><text x="95" y="170" font-size="13">V_R = 12 V</text><text x="130" y="88" font-size="13" transform="rotate(-33 130 88)">V_m = 15 V</text><path d="M70 150A30 30 0 0 0 66 137" stroke="#ffd166" fill="none" stroke-width="2"/><text x="78" y="143" font-size="13" style="fill:#ffd166">Φ</text><text x="198" y="105" font-size="12">V_L − V_C</text>`),
10:()=>W(0,`<g stroke="#8fa0e0" stroke-width="1.5"><line x1="160" y1="20" x2="160" y2="180"/><line x1="70" y1="100" x2="250" y2="100"/></g><text x="154" y="14" font-size="14">U</text><text x="154" y="196" font-size="14">S</text><text x="52" y="105" font-size="14">B</text><text x="254" y="105" font-size="14">T</text><g stroke="#ffd166" fill="none"><circle cx="205" cy="45" r="9"/><path d="M199 39l12 12M211 39l-12 12"/><circle cx="115" cy="45" r="9"/><path d="M109 39l12 12M121 39l-12 12"/><circle cx="205" cy="155" r="9"/><path d="M199 149l12 12M211 149l-12 12"/><circle cx="115" cy="155" r="9"/><path d="M109 149l12 12M121 149l-12 12"/></g>${arrow(160,150,160,70,"#5ee1ff","v (elektron, e⁻)",168,128)}<text x="30" y="26" font-size="11">⊗ = B masuk bidang bumi (ke bawah)</text>`)
};
const Q=[
{q:"Grafik di atas menunjukkan pergerakan sebuah robot pengiriman barang di lorong lurus selama 12 detik. Perbandingan antara <b>jarak tempuh total</b> dan <b>besar perpindahan</b> robot selama 12 detik tersebut adalah ....",o:["1 : 1","3 : 2","4 : 3","5 : 3","7 : 5"],a:2,e:"Hitung luas di bawah grafik v–t.<br>0–4 s: ½·4·12 = 24 · 4–8 s: 4·12 = 48 · 8–10 s: ½·2·12 = 12 → positif = 84 m.<br>10–12 s: ½·2·12 = 12 m (negatif, arah balik).<br>Jarak = 84 + 12 = 96 m, perpindahan = 84 − 12 = 72 m → 96 : 72 = <b>4 : 3</b>."},
{q:"Bola A dijatuhkan bebas dari puncak menara setinggi 80 m. Pada saat yang bersamaan, bola B dilemparkan vertikal ke atas dari dasar menara dengan kecepatan awal 40 m/s. Ketinggian tempat kedua bola berpapasan diukur dari tanah adalah ....",o:["20 m","30 m","40 m","50 m","60 m"],a:4,e:"Pakai g = 10 m/s². Saat berpapasan, h<sub>A</sub> = h<sub>B</sub>:<br>80 − 5t² = 40t − 5t² → 80 = 40t → t = 2 s.<br>Ketinggian = 40(2) − 5(2)² = 80 − 20 = <b>60 m</b>."},
{q:"Sebuah balok bermassa 5 kg ditarik ke atas sepanjang bidang miring kasar (sudut kemiringan 30°) sejauh 4 m dengan gaya sejajar bidang sebesar 60 N. Jika gaya gesek kinetis antara balok dan bidang adalah 10 N, maka usaha total (usaha bersih) yang bekerja pada balok tersebut adalah ....",o:["100 J","120 J","140 J","200 J","240 J"],a:0,e:"Gaya total sepanjang bidang (g = 10): F − f − mg sin 30° = 60 − 10 − 25 = 25 N.<br>W = 25 · 4 = <b>100 J</b>."},
{q:"Sebuah bola bermassa 0,5 kg meluncur tanpa gesekan dari puncak lintasan melengkung setinggi h = 5 m dengan kecepatan awal 2 m/s menuju lembah dasar (h = 0 m), lalu naik kembali ke bukit kedua setinggi h₂ = 3,4 m. Kecepatan bola saat tepat berada di puncak bukit kedua adalah ....",o:["4 m/s","5 m/s","6 m/s","8 m/s","10 m/s"],a:2,e:"Energi mekanik kekal: ½v₁² + g·h₁ = ½v₂² + g·h₂.<br>½(4) + 10(5) = ½v² + 10(3,4) → 52 = ½v² + 34 → v² = 36 → <b>v = 6 m/s</b>."},
{q:"Sebuah batang homogen AB sepanjang 4 m dan bermassa 6 kg ditumpu pada engsel di ujung A. Pada jarak 3 m dari A, batang ditahan oleh seutas tali vertikal ke atas sehingga batang setimbang mendatar. Jika beban tambahan bermassa 3 kg digantung tepat di ujung B, maka besar tegangan tali penahan tersebut adalah ....",o:["60 N","80 N","90 N","100 N","120 N"],a:1,e:"Torsi terhadap A sama dengan nol:<br>T · 3 = (6·10)(2) + (3·10)(4) = 120 + 120 = 240 → <b>T = 80 N</b>."},
{q:"Perhatikan bidang homogen gabungan antara persegi dan segitiga sama kaki pada koordinat Kartesius di atas (satuan dalam cm). Koordinat titik berat (x₀, y₀) dari luasan gabungan tersebut adalah ....",o:["(3 ; 4,0)","(3 ; 4,5)","(3 ; 4,67)","(3 ; 5,0)","(3 ; 5,5)"],a:2,e:"x₀ = 3 (simetris). Persegi: A₁ = 36, y₁ = 3. Segitiga: A₂ = 18, y₂ = 6 + 6/3 = 8.<br>y₀ = (36·3 + 18·8) / 54 = 252/54 = 14/3 → <b>y₀ ≈ 4,67 cm</b>.",w:"Catatan: pada soal asli tidak ada pilihan yang tepat (4,67). Pilihan C sudah diperbaiki menjadi (3 ; 4,67) agar sesuai hasil hitung."},
{q:"Besarnya tegangan pada rangkaian seri RLC digambarkan pada diagram fasor. Besar fase pada rangkaian ini adalah:",o:["−45°","−30°","0°","37°","60°"],a:0,e:"V<sub>L</sub> − V<sub>C</sub> = 2 − 6 = −4 V.<br>tan Φ = (V<sub>L</sub> − V<sub>C</sub>)/V<sub>R</sub> = −4/4 = −1 → <b>Φ = −45°</b> (rangkaian bersifat kapasitif)."},
{q:"Besarnya tegangan pada rangkaian seri RLC digambarkan pada diagram fasor. Besar tegangan maksimal pada rangkaian RLC ini adalah:",o:["8 V","12 V","16 V","20 V","24 V"],a:3,e:"Selisih reaktif = 20 − 8 = 12 V.<br>V<sub>m</sub> = √(16² + 12²) = √(256 + 144) = √400 = <b>20 V</b>."},
{q:"Sebuah rangkaian seri RLC memiliki tegangan maksimal 15 V. Bila persamaan tegangan pada resistor V<sub>R</sub> = 12 sin (40t), besarnya sudut fase Φ adalah:",o:["60°","53°","45°","37°","30°"],a:3,e:"V<sub>R</sub> maksimal = 12 V, V<sub>m</sub> = 15 V.<br>cos Φ = V<sub>R</sub>/V<sub>m</sub> = 12/15 = 0,8 → <b>Φ = 37°</b> (segitiga 3-4-5)."},
{q:"Sebuah elektron bergerak lurus ke arah Utara memasuki daerah bermedan magnetik homogen yang berarah vertikal ke bawah (masuk bidang bumi). Arah gaya Lorentz yang dialami elektron tersebut adalah ke ....",o:["Timur","Barat","Selatan","Vertikal ke atas","Tetap lurus ke Utara tanpa pembelokan"],a:0,e:"Untuk muatan positif: v (Utara) × B (bawah) menghasilkan arah Barat.<br>Elektron bermuatan negatif, sehingga arah gaya dibalik → <b>Timur</b>."}
];
const st=Q.map(()=>null);let cur=0,done=false;
const $=id=>document.getElementById(id);
function dots(){$("dots").innerHTML=Q.map((_,i)=>`<button class="dot ${i==cur?"cur":""} ${st[i]===null?"":(!done?"ok":(st[i]==Q[i].a?"ok":"bad"))}" onclick="go(${i})">${i+1}</button>`).join("");$("pb").style.width=(st.filter(x=>x!==null).length/Q.length*100)+"%"}
function go(i){if(done){const el=document.getElementById("r"+i);if(el)el.scrollIntoView({behavior:"smooth"});return}cur=i;render()}
function pick(k){st[cur]=k;render()}
function render(){
 dots();const q=Q[cur],d=st[cur]!==null,L="ABCDE";
 $("view").innerHTML=`<div class="card"><span class="tag">Soal ${cur+1} dari ${Q.length}</span><p class="q">${q.q}</p><div class="fig">${F[cur+1]()}</div>
 <div class="opts">${q.o.map((t,i)=>`<button class="opt ${i==st[cur]?"sel":""}" ${d?"disabled":""} onclick="pick(${i})"><b>${L[i]}</b><span>${t}</span></button>`).join("")}</div>
 <div class="nav"><button class="btn g" ${cur==0?"disabled":""} onclick="go(cur-1)">← Sebelumnya</button>${cur==Q.length-1?`<button class="btn" onclick="fin()">Selesai & Lihat Jawaban 🏆</button>`:`<button class="btn" onclick="go(cur+1)">Berikutnya →</button>`}</div></div>`
}
function fin(){
 done=true;dots();const s=st.filter((x,i)=>x===Q[i].a).length,n=st.filter(x=>x===null).length;
 $("view").innerHTML=`<div class="card score"><span class="tag">Hasil Latihan</span><div class="big">${s} / ${Q.length}</div><p>${s>=9?"Luar biasa, siap ujian! 🚀":s>=7?"Bagus! Tinggal sedikit lagi. 💪":s>=5?"Lumayan, ulangi soal yang salah ya. 📘":"Tetap semangat, pelajari pembahasannya lalu coba lagi. ✨"}${n?`<br><small>(${n} soal belum dijawab)</small>`:""}</p>
 <div class="rvs">${Q.map((q,i)=>`<div class="rv" id="r${i}"><b>${st[i]===null?"⚪":st[i]==q.a?"✅":"❌"} Soal ${i+1}</b><div class="rq">${q.q}</div><div class="fig">${F[i+1]()}</div><div>Jawabanmu: ${st[i]===null?"belum dijawab":"ABCDE"[st[i]]+". "+q.o[st[i]]}<br>Jawaban benar: <b>${"ABCDE"[q.a]}. ${q.o[q.a]}</b></div><div class="exp show">${q.e}${q.w?`<div class="warn">${q.w}</div>`:""}</div></div>`).join("")}</div>
 <button class="btn" onclick="st.fill(null);done=false;go(0);scrollTo(0,0)">🔄 Ulangi dari awal</button></div>`
}
render();
</script>
</body>
</html>
